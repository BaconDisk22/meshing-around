name: Intel Mac app and DMG (beta)
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*-beta.*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'mesh_bot.py'
      - 'modules/**'
      - 'requirements.txt'
      - '.github/workflows/intel-mac-app.yml'
jobs:
  build-intel:
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Headless validation
        run: |
          python -m compileall -q desktop
          python -m unittest discover -s tests -p 'test_radio_config.py' -v
          python -m unittest discover -s tests -p 'test_appearance.py' -v
          python -m unittest discover -s tests -p 'test_mac_first_launch.py' -v
          python -m unittest discover -s tests -p 'test_release_gate.py' -v
          python -m unittest discover -s tests -p 'test_radio_probe.py' -v
          python desktop/launcher.py --check
      - name: Stage runtime resources
        run: python desktop/stage_payload.py
      - name: Build bundled bot executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name meshing-around-bot --paths . \
            --collect-submodules bleak mesh_bot.py
      - name: Build Intel macOS desktop app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name "Meshing Around" \
            --target-architecture x86_64 \
            --paths desktop \
            --collect-submodules bleak \
            --osx-bundle-identifier org.meshingaround.desktop \
            --add-data "staging/payload:payload" \
            --add-binary "dist/meshing-around-bot:." \
            desktop/mac_app.py
      - name: Add macOS Bluetooth permission text and re-sign
        run: |
          PLIST="dist/Meshing Around.app/Contents/Info.plist"
          plutil -replace NSBluetoothAlwaysUsageDescription -string \
            "Meshing Around uses Bluetooth to connect to your Meshtastic radio." "$PLIST"
          codesign --force --deep --sign - "dist/Meshing Around.app"
          plutil -extract NSBluetoothAlwaysUsageDescription raw "$PLIST"
      - name: Confirm architecture and application layout
        run: |
          test -d "dist/Meshing Around.app"
          file "dist/Meshing Around.app/Contents/MacOS/Meshing Around"
          lipo -archs "dist/Meshing Around.app/Contents/MacOS/Meshing Around" | grep -q x86_64
          find "dist/Meshing Around.app/Contents" -name meshing-around-bot -type f | grep -q .
      - name: Validate bundled runtime files
        run: python desktop/verify_bundle.py 'dist/Meshing Around.app'
      - name: Smoke test frozen app without opening GUI
        run: |
          "dist/Meshing Around.app/Contents/MacOS/Meshing Around" --self-test
          test -f "$HOME/Library/Application Support/MeshingAround/runtime/config.ini"
          grep -q '^hostname = meshtastic.local' "$HOME/Library/Application Support/MeshingAround/runtime/config.ini"
      - name: Smoke test bundled radio library and bot startup failure handling
        run: |
          # Port 9 is closed on the runner, so both must fail cleanly, not crash.
          set +e
          "dist/Meshing Around.app/Contents/MacOS/Meshing Around" --probe-radio tcp 127.0.0.1:9 | tee probe.log
          probe_code=${PIPESTATUS[0]}
          RUNTIME="$HOME/Library/Application Support/MeshingAround/runtime"
          sed -i '' 's/^hostname = meshtastic.local/hostname = 127.0.0.1:9/' "$RUNTIME/config.ini"
          BOT=$(find "dist/Meshing Around.app/Contents" -name meshing-around-bot -type f | head -1)
          (cd "$RUNTIME" && "$GITHUB_WORKSPACE/$BOT") > bot.log 2>&1
          bot_code=$?
          set -e
          cat bot.log
          test "$probe_code" = 1
          grep -q '^RADIO_PROBE_FAILED' probe.log
          test "$bot_code" = 1
          grep -q 'abort. Initializing Interface1' bot.log
          ! grep -q 'Failed to execute script' bot.log
      - name: Package DMG
        run: |
          mkdir -p dmg-stage
          cp -R "dist/Meshing Around.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Meshing Around" -srcfolder dmg-stage \
            -ov -format UDZO "dist/Meshing-Around-Intel-Mac-Beta.dmg"
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshing-around-intel-mac-beta
          path: |
            dist/Meshing Around.app
            dist/Meshing-Around-Intel-Mac-Beta.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Verify beta tag and generate SHA-256
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python desktop/release_gate.py \
            --tag "${GITHUB_REF_NAME}" \
            --dmg "dist/Meshing-Around-Intel-Mac-Beta.dmg" \
            --output "dist/SHA256SUMS.txt"
      - name: Publish prerelease only after build and smoke checks
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Meshing-Around-Intel-Mac-Beta.dmg" \
            "dist/SHA256SUMS.txt" \
            --verify-tag --prerelease \
            --title "Meshing Around ${GITHUB_REF_NAME} (Intel Mac beta)" \
            --notes "Unsigned Intel x86_64 macOS beta. Requires user testing on Tahoe 26.7.1. No verified radio connectivity guarantee."
