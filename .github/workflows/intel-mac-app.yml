name: Intel Mac app and DMG (beta)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'mesh_bot.py'
      - 'modules/**'
      - 'requirements.txt'
      - '.github/workflows/intel-mac-app.yml'
jobs:
  build-intel:
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Headless validation
        run: |
          python -m compileall -q desktop
          python -m unittest discover -s tests -p 'test_radio_config.py' -v
          python -m unittest discover -s tests -p 'test_appearance.py' -v
          python desktop/launcher.py --check
      - name: Stage tracked application resources
        run: |
          mkdir -p staging/payload
          git ls-files -z | python -c 'import pathlib,sys; data=sys.stdin.buffer.read().split(b"\0"); p=pathlib.Path("staging/payload"); import shutil; [( (p/pathlib.Path(x.decode()).parent).mkdir(parents=True,exist_ok=True), shutil.copy2(x.decode(),p/x.decode())) for x in data if x and not x.startswith((b".github/",b"tests/",b".git/")) and x != b"config.ini"]'
      - name: Build bundled bot executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name meshing-around-bot --paths . mesh_bot.py
      - name: Build Intel macOS desktop app
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir \
            --name "Meshing Around" \
            --target-architecture x86_64 \
            --paths desktop \
            --add-data "staging/payload:payload" \
            --add-binary "dist/meshing-around-bot:." \
            desktop/mac_app.py
      - name: Confirm architecture and application layout
        run: |
          test -d "dist/Meshing Around.app"
          file "dist/Meshing Around.app/Contents/MacOS/Meshing Around"
          lipo -archs "dist/Meshing Around.app/Contents/MacOS/Meshing Around" | grep -q x86_64
          find "dist/Meshing Around.app/Contents" -name meshing-around-bot -type f | grep -q .
      - name: Package DMG
        run: |
          mkdir -p dmg-stage
          cp -R "dist/Meshing Around.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Meshing Around" -srcfolder dmg-stage \
            -ov -format UDZO "dist/Meshing-Around-Intel-Mac-Beta.dmg"
      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshing-around-intel-mac-beta
          path: |
            dist/Meshing Around.app
            dist/Meshing-Around-Intel-Mac-Beta.dmg
          if-no-files-found: error
          retention-days: 14
